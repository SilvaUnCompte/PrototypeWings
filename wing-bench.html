<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wing Linkage Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wing-bench.css">

</head>
<body>
<canvas id="stage"></canvas>

<section class="panel" aria-label="Contrôles">
  <div class="row">
    <h1>Wing Linkage Bench</h1>
  </div>
  <div>
    <div class="row">
      <span class="label">Moteur · angle</span>
      <span class="num" id="angleOut">—</span>
    </div>
    <input type="range" id="slider" min="-180" max="180" step="0.5" value="0" aria-label="Angle de la barre moteur">
  </div>
  <div class="row">
    <span class="chip" id="status">—</span>
    <span class="num" id="counts"></span>
  </div>
  <div class="btns">
    <button id="btnList">Liste des barres</button>
    <button id="btnReset" title="Revenir à la pose du dernier montage">Pose initiale</button>
    <button id="btnExample">Exemple carton</button>
    <button id="btnClear" class="danger">Tout effacer</button>
  </div>
  <div class="btns">
    <button id="btnExport">Exporter JSON</button>
    <button id="btnImport">Importer JSON</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <p class="hint"><b>Double-clic</b> : nouvelle barre<br><b>Clic</b> sur une barre : édition de la barre<br><b>Glisser</b> la barre : déplacer, une extrémité : pivoter/allonger</p>
</section>

<section class="panel" id="menu" hidden aria-label="Barre sélectionnée">
  <div class="row"><span class="label" id="menuTitle">Barre</span><button id="menuClose" aria-label="Fermer">✕</button></div>
  <label>Longueur (cm) <input type="number" id="inLen" step="0.1" min="0.5"></label>
  <label>Largeur (cm) <input type="number" id="inWidth" step="0.1" min="0.3"></label>
  <label>Angle (°) <input type="number" id="inAngle" step="1"></label>
  <div class="btns">
    <button id="btnDriver">Moteur</button>
    <button id="btnDelete" class="danger">Supprimer</button>
  </div>
</section>

<section class="panel" id="list" hidden aria-label="Liste des barres">
  <div class="row"><span class="label">Barres</span><button id="listClose" aria-label="Fermer">✕</button></div>
  <table>
    <thead><tr><th>Barre</th><th>Long. (cm)</th><th>Larg. (cm)</th></tr></thead>
    <tbody id="listBody"></tbody>
    <tfoot><tr><th>Total</th><td id="listTotal"></td><td></td></tr></tfoot>
  </table>
  <div class="scale">
    <label for="inScale">Échelle ×</label>
    <input type="number" id="inScale" step="0.1" min="0.1" value="1.5">
    <button id="btnScale">Appliquer</button>
  </div>
</section>

<script src="wing-bench.js"></script>
</body>
</html>
