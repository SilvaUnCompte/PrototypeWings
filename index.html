<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wing Linkage Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wing-bench.css">

</head>
<body>
<canvas id="stage"></canvas>

<section class="panel" aria-label="Controls">
  <div class="row">
    <h1>Wing Linkage Bench</h1>
  </div>
  <div>
    <div class="row">
      <span class="label">Motor · angle</span>
      <span class="num" id="angleOut">—</span>
    </div>
    <input type="range" id="slider" min="-180" max="180" step="0.5" value="0" aria-label="Motor bar angle">
  </div>
  <div class="row">
    <span class="chip" id="status">—</span>
    <span class="num" id="counts"></span>
  </div>
  <div class="btns">
    <button id="btnList">Bar list</button>
    <button id="btnExample">Cardboard example</button>
    <button id="btnClear" class="danger">Clear all</button>
  </div>
  <div class="btns">
    <button id="btnExport">Export JSON</button>
    <button id="btnImport">Import JSON</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <p class="hint"><b>Double-click</b>: new bar<br><b>Click</b> a bar: edit it<br><b>Drag</b> a bar: move it, drag an end: rotate/stretch<br><b>Shift+click/drag</b>, <b>Ctrl+A</b>: select several bars<br><b>Ctrl+Z</b> / <b>Ctrl+Y</b>: undo / redo</p>
</section>

<section class="panel popup" id="menu" hidden aria-label="Selected bar">
  <div class="row"><span class="label" id="menuTitle">Bar</span><button id="menuClose" aria-label="Close">✕</button></div>
  <label>Length (cm) <input type="number" id="inLen" step="0.1" min="0.5"></label>
  <label>Width (cm) <input type="number" id="inWidth" step="0.1" min="0.3"></label>
  <label>Angle (°) <input type="number" id="inAngle" step="1"></label>
  <div class="btns">
    <button id="btnDriver">Motor</button>
    <button id="btnDelete" class="danger">Delete</button>
  </div>
</section>

<section class="panel popup" id="pinMenu" hidden aria-label="Pin">
  <div class="row"><span class="label">Pin</span><button id="pinMenuClose" aria-label="Close">✕</button></div>
  <button id="btnAnchor">Attach to base</button>
</section>

<section class="panel popup" id="baseMenu" hidden aria-label="Fixed base">
  <div class="row"><span class="label">Fixed base</span><button id="baseMenuClose" aria-label="Close">✕</button></div>
  <label>Width (cm) <input type="number" id="inBaseW" step="0.1" min="1"></label>
  <label>Height (cm) <input type="number" id="inBaseH" step="0.1" min="1"></label>
  <span class="label">Wearer silhouette</span>
  <label class="check"><input type="checkbox" id="inPersonOn"> Show</label>
  <label>Height (cm) <input type="number" id="inPersonH" step="1" min="50"></label>
  <label>Shoulders (cm) <input type="number" id="inPersonS" step="1" min="10"></label>
  <label>Head + neck (cm) <input type="number" id="inPersonHead" step="1" min="5"></label>
  <label>Raise (cm) <input type="number" id="inPersonDy" step="1"></label>
</section>

<section class="panel" id="list" hidden aria-label="Bar list">
  <div class="row"><span class="label">Bars</span><button id="listClose" aria-label="Close">✕</button></div>
  <table>
    <thead><tr><th>Bar</th><th>Len. (cm)</th><th>Wid. (cm)</th></tr></thead>
    <tbody id="listBody"></tbody>
    <tfoot><tr><th>Total</th><td id="listTotal"></td><td></td></tr></tfoot>
  </table>
  <div class="scale">
    <label for="inScale">Scale ×</label>
    <input type="number" id="inScale" step="0.1" min="0.1" value="1.5">
    <button id="btnScale">Apply</button>
  </div>
</section>

<script src="wing-bench.js"></script>
</body>
</html>
